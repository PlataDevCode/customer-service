service: customer-service

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: dev
  environment:
    NODE_ENV: production

functions:
  api:
    handler: dist/src/handler.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY

package:
  patterns:
    - '!src/**'
    - 'dist/**'
    - 'node_modules/**'
